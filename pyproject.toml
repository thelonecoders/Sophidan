# ---------------------------------------------------------------------------
# Academic Research Suite — PEP 621 project metadata
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-research-suite"
version = "2.0.0"
description = "A pure-Python PyQt desktop suite for academic literature scraping, analysis, knowledge-graph building, AI assistance, and reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Academic Research Suite Contributors" }
]
keywords = [
    "academic",
    "research",
    "scraping",
    "bibliometrics",
    "knowledge-graph",
    "pyqt",
    "desktop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dynamic = ["dependencies"]

[project.scripts]
ars = "main:main"
ars-web = "web.server:run_server"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-cov>=4.1",
    "black>=24.2",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/thelonecoders/Sophidan"
Issues = "https://github.com/thelonecoders/Sophidan/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "core*",
    "utils*",
    "data_acquisition*",
    "proxy*",
    "data_science*",
    "knowledge_graph*",
    "ai_assistant*",
    "reporting*",
    "project_management*",
    "database*",
    "ui*",
    "web*",
    # v2.0.0 packages
    "bibliometrics*",
    "networkx_pro*",
    "gephi_viz*",
    "systematic_review*",
    "meta_analysis*",
    "prisma*",
    "q1_figures*",
    "research_lifecycle*",
    "innovation*",
]
exclude = ["tests*", "docs*", "data", "logs*", "upload*"]

# ``main.py`` is a top-level module (not part of any package) and backs the
# ``ars = main:main`` console script.
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.qss", "*.json", "*.toml"]
# Flask/Jinja templates are data files inside the `web` package (no __init__.py).
"web" = ["templates/*.html"]

# Never ship local credentials even if a secrets.yaml exists next to config/.
[tool.setuptools.exclude-package-data]
"*" = ["secrets.yaml", "*.db", "*.db-wal", "*.db-shm"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
